<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | PrimeCut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth">
    <div class="auth-art" role="img" aria-label="Raw steak on a butcher board"><blockquote>The best cut is the one weighed in front of you.</blockquote></div>
    <div class="auth-panel">
      <div class="auth-box">
        <a class="logo" href="index.html"><span class="logo-mark" aria-hidden="true"></span>PrimeCut</a>
        <h1 style="font-size:2rem;margin-top:1.5rem">Sign in</h1>
        <p class="muted">Customers see the shop. Staff go straight to the back office.</p>
        <div id="form-msg" class="alert hidden" role="alert"></div>
        <form id="login-form" novalidate>
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
          <button class="btn btn-primary" style="width:100%" type="submit">Sign in</button>
        </form>
        <p class="muted small" style="margin-top:1.25rem">New here? <a href="register.html">Create an account</a></p>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
